
name: Build Shiloh for Windows

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,wasm32-unknown-unknown

      - name: Build Windows package
        shell: bash
        run: |
          bash .github/scripts/package.sh \
            windows-x64 \
            windows-x86_64 \
            x86_64-pc-windows-msvc

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: shiloh-windows-x86_64
          path: dist/shiloh-windows-x64-windows-x86_64.zip
          if-no-files-found: error
